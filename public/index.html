<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عبودي</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>عبودي</h1>
      <p class="hint">نسخة جاهزة: محادثة + إضافة معرفة محلية (تدريب بسيط).</p>

      <section id="chatBox" class="chat-box" aria-live="polite"></section>

      <form id="chatForm" class="chat-form">
        <textarea
          id="messageInput"
          rows="3"
          placeholder="اكتب رسالتك هنا..."
          required
        ></textarea>
        <button type="submit">إرسال</button>
      </form>

      <hr />

      <h2>إضافة معرفة (Training بسيط)</h2>
      <form id="trainForm" class="train-form">
        <input id="questionInput" type="text" placeholder="السؤال" required />
        <textarea id="answerInput" rows="3" placeholder="الإجابة" required></textarea>
        <input id="tagsInput" type="text" placeholder="وسوم اختيارية (مثال: اسعار, دعم)" />
        <button type="submit">حفظ المعرفة</button>
      </form>

      <p id="trainStatus" class="hint"></p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
